name: app_noticias_tii
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0 # O http foi movido para cá corretamente
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/img/icone-portal-br.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

  dependencies:
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#42a5f5"
  image: assets/img/icone-portal-br-1152.png
  fullscreen: true

  android_12:
    color: "#42a5f5"
    image: assets/img/icone-portal-br-1152.png
    icon_background_color: "#111111"
